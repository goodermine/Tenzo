<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VOX Deploy v0.1</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin-top: 1rem; font-weight: 600; }
      input, textarea, button { width: 100%; margin-top: 0.35rem; padding: 0.65rem; }
      button { cursor: pointer; margin-top: 1rem; }
      pre { background: #111; color: #d9ffd9; padding: 1rem; white-space: pre-wrap; border-radius: 6px; }
      .hint { color: #555; }
    </style>
  </head>
  <body>
    <h1>VOX Deploy v0.1</h1>
    <p class="hint">Privacy: your audio is analyzed locally. Only extracted features and your text context are sent to the configured LLM endpoint.</p>
    <p class="hint">Set your API key in <code>.env</code> (LLM_API_KEY) before analyzing.</p>

    <form id="analyse-form">
      <label for="audio">Audio file (wav/mp3)</label>
      <input id="audio" name="audio" type="file" accept="audio/*" required />

      <label for="goal">Goal</label>
      <input id="goal" name="goal" type="text" placeholder="e.g. improve pitch stability" />

      <label for="style_target">Style target</label>
      <input id="style_target" name="style_target" type="text" placeholder="e.g. conversational podcast voice" />

      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" rows="4" placeholder="Optional notes"></textarea>

      <button type="submit">Analyse</button>
    </form>

    <h2>Result</h2>
    <pre id="result">Waiting for analysis...</pre>

    <script>
      const form = document.getElementById('analyse-form');
      const result = document.getElementById('result');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        result.textContent = 'Running analysis...';

        const formData = new FormData(form);

        try {
          const response = await fetch('/analyse', {
            method: 'POST',
            body: formData,
          });

          const data = await response.json();
          if (!response.ok) {
            result.textContent = JSON.stringify(data, null, 2);
            return;
          }

          result.textContent = data.report;
        } catch (error) {
          result.textContent = `Request failed: ${error}`;
        }
      });
    </script>
  </body>
</html>
