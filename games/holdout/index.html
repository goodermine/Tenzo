<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HOLDOUT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>
<div id="touch"></div>
<div id="stick-base"></div>
<div id="stick-knob"></div>

<div id="hud">
  <div class="xp"><div class="xp-fill"></div></div>
  <div class="row">
    <button class="pause" aria-label="Pause"><span></span><span></span></button>
    <div class="level">LV 1</div>
    <div class="timer">00:00</div>
    <div class="kills">0</div>
  </div>
</div>

<div id="banner"></div>
<div id="bossbar"><div class="name"></div><div class="bar"><div class="fill"></div></div></div>
<div id="fps"></div>

<div id="levelup" class="overlay">
  <div class="panel">
    <div class="title">LEVEL UP</div>
    <div class="lv">LEVEL 2</div>
    <div class="cards"></div>
  </div>
</div>

<div id="title" class="overlay on">
  <div class="panel">
    <div class="logo">HOLD<span>OUT</span></div>
    <div class="sub">Survive fifteen minutes.</div>
    <button class="big start">TAP TO DEPLOY</button>
    <div class="hint">Drag anywhere to move. Weapons fire on their own.</div>
  </div>
</div>

<div id="paused" class="overlay">
  <div class="panel">
    <div class="title">PAUSED</div>
    <div class="loadout"></div>
    <div class="toggles">
      <button class="toggle" data-setting="sound">SOUND</button>
      <button class="toggle" data-setting="haptics">VIBRATION</button>
      <button class="toggle" data-setting="fps">FPS</button>
    </div>
    <button class="big resume">RESUME</button>
    <button class="ghost quit">ABANDON RUN</button>
  </div>
</div>

<div id="over" class="overlay">
  <div class="panel">
    <div class="title">SIGNAL LOST</div>
    <div class="stats"></div>
    <div class="loadout"></div>
    <button class="big again">DEPLOY AGAIN</button>
  </div>
</div>

<div id="boot">LOADING</div>
<script type="module" src="dist/holdout.js"></script>
</body>
</html>
